name: CarLyrics
options:
  bundleIdPrefix: com.carlyrics
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

# Para activar el SDK nativo de Spotify (App Remote, menor latencia),
# descomentá este bloque y la entrada `dependencies` del target.
# Ver docs/SPOTIFY-SETUP.md. Sin él la app funciona vía Spotify Web API:
# `SpotifyAppRemoteSource` entero está detrás de `#if canImport(SpotifyiOS)`.
# packages:
#   SpotifyiOS:
#     url: https://github.com/spotify/ios-sdk
#     from: "3.0.0"

targets:
  CarLyrics:
    type: application
    platform: iOS

    sources:
      # Código y recursos que sí van al bundle (XcodeGen clasifica solo los
      # .swift, .xcassets y .strings en sus respectivas fases).
      - path: Sources/CarLyrics
        excludes:
          - "Resources/Info.plist"
          - "Resources/CarLyrics.entitlements"
          - "Resources/Products.storekit"
          - "**/.DS_Store"

      # Estos tres se referencian por build setting o por el scheme, no se
      # copian al bundle. `buildPhase: none` los deja visibles en Xcode sin
      # que se empaqueten.
      - path: Sources/CarLyrics/Resources/Info.plist
        buildPhase: none
      - path: Sources/CarLyrics/Resources/CarLyrics.entitlements
        buildPhase: none
      - path: Sources/CarLyrics/Resources/Products.storekit
        buildPhase: none

    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig

    settings:
      base:
        INFOPLIST_FILE: Sources/CarLyrics/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/CarLyrics/Resources/CarLyrics.entitlements
        # APP_BUNDLE_ID sale de Configuration/Secrets.xcconfig.
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: CarLyrics
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

    # dependencies:
    #   - package: SpotifyiOS

    scheme:
      testTargets:
        - CarLyricsTests
      gatherCoverageData: true
      environmentVariables:
        # Poné "1" para ver la app funcionando con una canción de ejemplo,
        # sin cuenta de Spotify ni auto. Útil para la UI de CarPlay.
        CARLYRICS_SIMULATED_PLAYBACK: "0"

  CarLyricsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CarLyricsTests
    dependencies:
      - target: CarLyrics
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
